# Ekran modułu w panelu silnika.
#
# _legacy_controller wskazuje własną zakładkę modułu (`AdminQuinceFeatureRank`). Do niej
# odnoszą się uprawnienia pracownika: atrybuty `#[AdminSecurity]` w kontrolerach
# sprawdzają prawa do tej zakładki.

quince_feature_rank_settings:
  path: quince/feature-rank
  methods: [GET]
  defaults:
    _controller: Quince\FeatureRank\Controller\Admin\SettingsController::indexAction
    _legacy_controller: 'AdminQuinceFeatureRank'
    _legacy_link: 'AdminQuince'

quince_feature_rank_recompute:
  path: quince/feature-rank/recompute
  methods: [POST]
  defaults:
    _controller: Quince\FeatureRank\Controller\Admin\SettingsController::recomputeAction
    _legacy_controller: 'AdminQuinceFeatureRank'
    _legacy_link: 'AdminQuince'

quince_feature_rank_save:
  path: quince/feature-rank/save
  methods: [POST]
  defaults:
    _controller: Quince\FeatureRank\Controller\Admin\SettingsController::saveAction
    _legacy_controller: 'AdminQuinceFeatureRank'
    _legacy_link: 'AdminQuince'


quince_feature_rank_facets_update:
  path: quince/feature-rank/facets/update
  methods: [POST]
  defaults:
    _controller: Quince\FeatureRank\Controller\Admin\SettingsController::facetsUpdateAction
    _legacy_controller: 'AdminQuinceFeatureRank'
    _legacy_link: 'AdminQuince'

quince_feature_rank_facets_restore:
  path: quince/feature-rank/facets/restore
  methods: [POST]
  defaults:
    _controller: Quince\FeatureRank\Controller\Admin\SettingsController::facetsRestoreAction
    _legacy_controller: 'AdminQuinceFeatureRank'
    _legacy_link: 'AdminQuince'
